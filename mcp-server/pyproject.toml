[project]
name = "scale-guinstall-mcp"
version = "0.2.0"
description = "MCP server for driving Scale GUInstall's backend (scale-server.py) as agent tool calls — a thin HTTP+SSE client, not a reimplementation. Runs locally next to the agent; the backend it talks to runs on the Storage Scale installer node."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
scale-guinstall-mcp = "scale_guinstall_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "flask>=3.0,<4", "waitress>=3.0,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
