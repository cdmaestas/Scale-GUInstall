# Lint config shared by the backend (scale-server.py), the MCP server package and the tests.
# Deliberately small: real-bug and hygiene rules only. The code base is not ruff-formatted,
# so `ruff format` is not enforced.
target-version = "py310"
line-length = 120

[lint]
select = [
    "E9",   # syntax errors
    "F",    # pyflakes: undefined names, unused imports/variables
    "I",    # import ordering
    "B",    # bugbear: likely bugs (mutable defaults, zip without strict, ...)
    "PIE",  # misc. correctness/simplification
]
