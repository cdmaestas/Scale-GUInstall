const data={"title": "CES and NFS: from failed health checks to confirmation", "description": "A condensed two-environment historical troubleshooting case.", "words_per_minute": 135, "buffer_seconds": 2, "scenes": [{"title": "Why CES and NFS stayed inactive", "lines": ["HISTORICAL CASE STUDY — edited reenactment", "Diagnosis in Environment A; confirmation in Environment B.", "Final successful run covers NFS and SMB, not S3."], "narration": "This case follows a failed protocol deployment through diagnosis and confirmation in a fresh environment. It is an edited historical account. The successful run at the end covers NFS and SMB; it is separate from the three-protocol installation shown elsewhere.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 0.6, "end": 30.25}, "duration": 19.78, "start": 0}, {"title": "1. Task success was not service health", "lines": ["DEPLOY RECAP LOOKS CLEAN", "SMB, monitoring and GUI ACTIVE.", "CES and NFS NOT ACTIVE.", "", "Check service health, not only the Ansible recap."], "narration": "The deployment tasks complete, but the service checks tell a different story. SMB is active while CES and NFS are not. The distinction matters: a clean task recap does not establish that every service is usable. The investigation follows the failing health checks.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 30.25, "end": 52.66}, "duration": 21.11, "start": 19.78}, {"title": "2. Address assignment remains blocked", "lines": ["IN THIS FAILED RUN", "CES addresses remain unassigned.", "Manual assignment is refused while nodes are unhealthy.", "Suspend/resume briefly clears a flag; it returns.", "", "The underlying health problem is still present."], "narration": "The addresses remain unassigned in this run. A manual assignment is refused, and suspending and resuming the nodes clears the failure flag only briefly. That points away from treating the flag itself as the cause. Something is continuing to make the protocol nodes unhealthy.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 52.66, "end": 105.41}, "duration": 21.56, "start": 40.89}, {"title": "3. Inspect the services", "lines": ["RECORDED SERVICE STATUS", "NFS-Ganesha: inactive", "rpcbind.service: masked and inactive", "rpcbind.socket: also masked", "", "The masked dependency prevents normal service startup."], "narration": "Direct service checks reveal a masked RPC bind service and socket, alongside inactive NFS-Ganesha. Masking prevents the dependency from starting normally. This is the concrete fault found in the session. The next step is to check the same condition in a fresh environment.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 105.41, "end": 151.84}, "duration": 21.11, "start": 62.45}, {"title": "4. Confirm and fix in a fresh environment", "lines": ["ENVIRONMENT B — before installation", "The same rpcbind masking is present.", "Unmask service and socket; enable and start both.", "Verify socket listening and service running on both nodes.", "", "This is a new run, not a continuation of the failed install."], "narration": "The fresh environment has the same masked service and socket. They are unmasked, enabled, and started before installation. Both protocol nodes are checked for active status. This preserves the important distinction between identifying a cause in one environment and confirming the correction in another.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 151.84, "end": 187.06}, "duration": 21.56, "start": 83.56}, {"title": "5. Install, then verify directly", "lines": ["SETUP AND INSTALLATION SUMMARIZED", "Nodes and storage configured; callhome/precheck resolved.", "Installation runs; log visibility is lost near the end.", "", "Direct checks: cluster exists, seven nodes active, filesystems present."], "narration": "The repeated setup and installation steps are summarized here. Near the end, the log stream loses visibility, so the operator checks the cluster directly. The cluster exists, all seven nodes are active, and the filesystems are present. Lost output is not treated as proof of failed work.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 187.06, "end": 268.61}, "duration": 22.89, "start": 105.12}, {"title": "6. Prepare protocol deployment", "lines": ["CONFIRM ADDRESS OWNERSHIP BEFORE USE", "Use the environment’s reserved CES addresses.", "A ping timeout alone does not establish that an IP is free.", "", "Configure shared root, interface and address pool.", "Enable NFS and SMB; run deployment precheck."], "narration": "Protocol configuration uses the environment’s reserved CES addresses. The historical recording also showed a ping timeout, but that alone does not establish an unused address. Confirm allocation before use. With the shared root, interface, and pool configured, NFS and SMB are enabled and the deployment precheck passes.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 268.61, "end": 296.97}, "duration": 22.89, "start": 128.01}, {"title": "7. Confirm the new deployment", "lines": ["FRESH-ENVIRONMENT DEPLOY: 12 minutes 33 seconds", "Filesystem and CES ACTIVE.", "NFS and SMB ACTIVE.", "Monitoring and GUI ACTIVE.", "SUCCESS — all services running."], "narration": "In the new environment, deployment completes in about twelve and a half minutes. CES, NFS, SMB, the filesystem, monitoring, and the GUI are active. That result supports the correction in this case. It does not make service masking the explanation for every future NFS failure.", "source": {"file": "techzone-runbook-walkthrough-2.cast", "start": 296.97, "end": 334.523}, "duration": 22.0, "start": 150.9}], "duration": 172.9};
