</style></head><body><main><h1>CLI walkthrough: a real installation, command by command</h1>

</main><script>
const data={"title": "CLI walkthrough: a real installation, command by command", "description": "The spectrumscale commands the backend ran during one real installation on 2026-10-05, with lines quoted from the toolkit's own output. Pacing is generated.", "words_per_minute": 135, "buffer_seconds": 2, "footer": "RECORDED RUN 2026-10-05 | Real commands and output; generated pacing.", "note": "Built from the logged output of one real run. Silent playback; read the synchronized narration aloud. Starts paused.", "scenes": [{"title": "A real run, command by command", "lines": ["REAL RUN | 2026-10-05 | IBM Storage Scale 6.0.1.1", "Installer node plus seven cluster nodes | NFS, SMB and S3", "", "Commands are the ones the backend executed on the installer", "node. Output lines are quoted from its operation logs.", "The toolkit path is shortened to \".../\" and INFO markers are", "dropped. Pacing is generated: per-line timing was not recorded.", "", "The GUI and the MCP tools run these same commands."], "narration": "This is the command line behind one real installation. Each screen shows the spectrumscale commands the backend ran on the installer node, with lines quoted from the toolkit's own output. Nobody typed these here: they were issued through the MCP tools and the GUI. The pacing is generated, but the commands and output are real.", "source": {"capture": "2026-10-05-run", "phases": []}, "duration": 26.44, "start": 0}, {"title": "1. Start the installation service", "lines": ["$ sudo -n .../spectrumscale setup -s 10.249.129.127", "Your ansible controller node has been configured to use the IP 10.249.129.127 to communicate with other nodes.", "Port 10080 will be used for package distribution.", "SUCCESS", "", "Operation time       2.8s"], "narration": "First the toolkit installs its installation service on the installer node. The command is spectrumscale setup with the installer's address. The output confirms the Ansible controller will use that address and that port 10080 serves the packages. It finished in under three seconds.", "source": {"capture": "2026-10-05-run", "phases": ["setup"]}, "duration": 21.11, "start": 26.44}, {"title": "2. Define the seven nodes", "lines": ["$ sudo -n .../spectrumscale node delete scale-server1", "$ sudo -n .../spectrumscale node add scale-client1", "(one delete and one add for each of the seven nodes)", "[ FATAL ] Node scale-server1-rqhtc64k does not exist in the current configuration. Check environment with 'spectrumscale node list'.", "[ WARN  ] Found a mis-ordered line in the /etc/hosts file on scale-server1-rqhtc64k which is incorrectly formatted. This may affect initial cluster creation. In case of failure during initial cluster creation, please format the entries in the /etc/hosts as '\u003cIP> \u003cFQDN> \u003cALIAS>') and retry", "Adding node scale-server1-rqhtc64k as a quorum node.", "Adding node scale-server1-rqhtc64k as an NSD server.", "Setting scale-gui1-rqhtc64k as an admin node.", "Setting scale-proto1-rqhtc64k as a protocol node."], "narration": "Next the seven nodes are defined, one node delete and one node add each. The FATAL line is expected on a first run, because the delete finds nothing to remove. The warning about hosts file ordering is also expected; the runbook notes both. The info lines show the roles each node receives.", "source": {"capture": "2026-10-05-run", "phases": ["node-config"]}, "duration": 25.11, "start": 47.55}, {"title": "3. Read back the node table", "lines": ["GPFS                   Admin  Quorum  Manager   NSD   Protocol   GUI     OS   Arch", "Node                    Node   Node     Node   Server   Node    Server", "scale-client1-rqhtc64k                                                 rhel9  x86_64", "scale-client2-rqhtc64k                                                 rhel9  x86_64", "scale-gui1-rqhtc64k      X       X                                X    rhel9  x86_64", "scale-proto1-rqhtc64k                    X                X            rhel9  x86_64", "scale-proto2-rqhtc64k                    X                X            rhel9  x86_64", "scale-server1-rqhtc64k           X       X       X                     rhel9  x86_64", "scale-server2-rqhtc64k           X       X       X                     rhel9  x86_64", "", "[Protocols]", "S3     : Enabled", "SMB    : Enabled", "NFS    : Enabled", "HDFS   : Disabled", "", "Read after the protocols were applied (step 6)."], "narration": "The node list shows the result. Two nodes are NSD, manager and quorum; the GUI node is admin, quorum and GUI; the two protocol nodes are managers and protocol nodes; the two clients have no roles. This listing was read after the protocols were applied, so its protocol block already shows S3, SMB and NFS enabled.", "source": {"capture": "2026-10-05-run", "phases": ["node-list"]}, "duration": 26.89, "start": 72.66}, {"title": "4. Define the storage", "lines": ["$ sudo -n .../spectrumscale nsd add -p scale-server1 -u dataAndMetadata -fg 1 -fs cesSharedRoot /dev/vdd", "$ sudo -n .../spectrumscale nsd add -p scale-server2 -u dataOnly -fg 2 -po data -fs fs1 /dev/vdf", "(six NSD adds in all; the other four were not seen echoed)", "", "Name FS            Size(GB) Usage           FG Pool    Device   Servers", "nsd1 cesSharedRoot 100.0    dataAndMetadata 1  system  /dev/vdd scale-server1-rqhtc64k", "nsd2 fs1           100.0    dataAndMetadata 1  Default /dev/vde scale-server1-rqhtc64k", "nsd3 fs1           100.0    dataOnly        1  data    /dev/vdf scale-server1-rqhtc64k", "nsd4 cesSharedRoot 100.0    dataAndMetadata 2  Default /dev/vdd scale-server2-rqhtc64k", "nsd5 fs1           100.0    dataAndMetadata 2  Default /dev/vde scale-server2-rqhtc64k", "nsd6 fs1           100.0    dataOnly        2  data    /dev/vdf scale-server2-rqhtc64k"], "narration": "Six NSDs are defined from the three free disks on each storage server: one for the CES shared root filesystem and two for fs1, with failure groups one and two. Two of the six add commands are shown, and the table below is the toolkit's own listing. The dataOnly disks join a pool named data.", "source": {"capture": "2026-10-05-run", "phases": ["nsd-add", "nsd-list"]}, "duration": 26.44, "start": 99.55}, {"title": "5. Call home and cluster settings", "lines": ["$ sudo -n .../spectrumscale callhome disable", "Disabling the callhome.", "", "$ sudo -n .../spectrumscale config gpfs --ephemeral_port_range 60000-61000", "Setting ephemeral_port_range to 60000-61000", "Setting perfmon to on", "", "Call home is on by default; it must be configured or", "disabled before the install precheck will pass."], "narration": "Call home is on by default, and without settings the precheck fails, so it is disabled here. The cluster settings set the ephemeral port range to 60000 through 61000 and leave performance monitoring on.", "source": {"capture": "2026-10-05-run", "phases": ["callhome", "cluster-config"]}, "duration": 17.11, "start": 125.99}, {"title": "6. Configure and enable the protocols", "lines": ["$ sudo -n .../spectrumscale config protocols -f cesSharedRoot -m /ibm/cesSharedRoot -i eth1 -e 10.249.128.200,10.249.128.201", "Setting export_ip_pool to ['10.249.128.200', '10.249.128.201']", "Setting filesystem to cesSharedRoot", "Setting mountpoint to /ibm/cesSharedRoot", "[ WARN ] CIDR value has not been passed with Export ces ip's, Installer will continue to work on Legacy mode.", "Setting interface to eth1", "[OK] Protocol configuration set.", "", "$ sudo -n .../spectrumscale enable nfs smb s3", "[OK] Enabled: nfs, smb, s3."], "narration": "The CES settings name the shared root filesystem, its mount point, the network interface and two export addresses. These two commands were run from the GUI's Apply Protocols panel, which prints the same command and output. The warning about CIDR notation only means the toolkit stays in legacy mode. Then NFS, SMB and S3 are enabled.", "source": {"capture": "2026-10-05-run", "phases": ["protocols"]}, "duration": 26.89, "start": 143.1}, {"title": "7. Precheck the install", "lines": ["$ sudo -n .../spectrumscale install --precheck", "GPFS precheck OK", "Network check from admin node scale-gui1-rqhtc64k to all other nodes in the cluster passed", "[ WARN  ] NSDs on the node scale-server1-rqhtc64k may not be load-balanced", "[ WARN  ] Only one GUI server specified. The Graphical User Interface will not be highly available.", "[ WARN  ] The NSD nsd1 only has one server configured. This may affect the ability to run concurrent maintenance on this cluster.", "scale-server1-rqhtc64k     : ok=10   changed=0    unreachable=0    failed=0    skipped=30   rescued=0    ignored=0", "Pre-check successful for install.", "", "Operation time       1m 24.8s"], "narration": "The install precheck validates the configuration without changing anything. It reports warnings: the NSDs may not be load balanced, there is one GUI server, and each NSD has a single server. The runbook treats these as expected for a small lab with node-local disks. The network checks pass and every node reports failed equals zero. It took about a minute and a half.", "source": {"capture": "2026-10-05-run", "phases": ["precheck-install"]}, "duration": 30.0, "start": 169.99}, {"title": "8. Run the install", "lines": ["$ sudo -n .../spectrumscale install", "4 x FAILED - RETRYING: wait-daemon-active (scale-server1)", "2 x FAILED - RETRYING: wait for gpfsgui (scale-gui1)", "TASK [ibm.spectrum_scale.core_configure : cluster | Create new cluster] ********", "TASK [ibm.spectrum_scale.core_configure : storage | Create new NSDs] ***********", "TASK [ibm.spectrum_scale.core_configure : storage | Create new filesystem(s)] ***", "scale-server1-rqhtc64k     : ok=160  changed=38   unreachable=0    failed=0    skipped=362  rescued=0    ignored=0", "scale-gui1-rqhtc64k        : ok=90   changed=18   unreachable=0    failed=0    skipped=165  rescued=0    ignored=0", "Installation successful. 7 GPFS nodes active in cluster scale-gui1-rqhtc64k. Completed in 26 minutes 27 seconds."], "narration": "The install itself is one command and took about twenty-six minutes. The log shows a few retry lines while the toolkit waits for the GPFS daemon on the first server and for the GUI service to come up; the waits ended and the run continued. The tasks that create the cluster, the NSDs and the filesystems run, and the toolkit finishes with seven GPFS nodes active.", "source": {"capture": "2026-10-05-run", "phases": ["install"]}, "duration": 31.33, "start": 199.99}, {"title": "9. Check the install", "lines": ["$ sudo -n .../spectrumscale install --postcheck", "5 server licenses and 2 client licenses enabled on the cluster. Ensure enough licenses are owned for this configuration.", "GPFS ACTIVE", "NSDs ACTIVE", "Performance Monitoring ACTIVE", "GUI ACTIVE", "SUCCESS", "All services running", "", "Operation time       12.7s"], "narration": "The install postcheck verifies the result. GPFS is active on all nodes, the NSDs are active, performance monitoring and the GUI are active, and it ends with success and all services running. It also reports the licenses enabled on the cluster, which you should check against what you own.", "source": {"capture": "2026-10-05-run", "phases": ["postcheck-install"]}, "duration": 23.78, "start": 231.32}, {"title": "10. Precheck the deploy", "lines": ["$ sudo -n .../spectrumscale deploy --precheck", "NSDs are in a valid state", "protocol precheck OK", "S3 precheck OK", "SMB precheck OK", "NFS precheck OK", "Network check from protocol node scale-proto1-rqhtc64k to all other protocol nodes in the cluster passed", "Pre-check successful for deploy.", "", "Operation time       3m 55.2s"], "narration": "The deploy precheck now covers the protocols. The NSDs are in a valid state, the protocol, S3, SMB and NFS prechecks all pass, and so does the network check between protocol nodes. This precheck took almost four minutes here.", "source": {"capture": "2026-10-05-run", "phases": ["precheck-deploy"]}, "duration": 19.33, "start": 255.1}, {"title": "11. Deploy the protocols", "lines": ["$ sudo -n .../spectrumscale deploy", "ASYNC FAILED on scale-server1-rqhtc64k: jid=j57012116952.106400", "One Ansible async job reported FAILED; the play went on.", "Recap: failed=0 everywhere, and the postcheck passes.", "The cause of that line was not investigated.", "", "scale-server1-rqhtc64k     : ok=60   changed=11   unreachable=0    failed=0    skipped=116  rescued=0    ignored=0", "scale-proto1-rqhtc64k      : ok=34   changed=2    unreachable=0    failed=0    skipped=72   rescued=0    ignored=0", "Successfully installed and configured protocols. 2 protocol nodes were enabled. Components installed: Filesystem, Cluster Export Services, S3, SMB, NFS, Performance Monitoring, GUI, FILE AUDIT LOGGING. It took 17 minutes 26 seconds.", "", "Operation time       17m 28.2s"], "narration": "Deploy creates the filesystems and brings up Cluster Export Services with NFS, SMB and S3. It took about seventeen and a half minutes. One line in the log says ASYNC FAILED for a background Ansible job on the first server. The play carried on, every host in the recap shows failed equals zero, and the postcheck passes, but the cause of that line was not investigated. The toolkit ends by reporting protocols installed and configured on two protocol nodes.", "source": {"capture": "2026-10-05-run", "phases": ["deploy"]}, "duration": 37.11, "start": 274.43}, {"title": "12. Check the deploy", "lines": ["$ sudo -n .../spectrumscale deploy --postcheck", "File systems have been created successfully", "Filesystem ACTIVE", "Cluster Export Services ACTIVE", "S3 ACTIVE", "SMB ACTIVE", "NFS ACTIVE", "SUCCESS", "All services running", "", "Operation time       9.3s"], "narration": "The deploy postcheck confirms the filesystems were created, and that Cluster Export Services, S3, SMB and NFS are all active.", "source": {"capture": "2026-10-05-run", "phases": ["postcheck-deploy"]}, "duration": 10.89, "start": 311.54}, {"title": "13. Verify the export addresses", "lines": ["$ sudo /usr/lpp/mmfs/bin/mmces address list", "Address          Node                    Ces Group   Attributes", "---------------- ----------------------- ----------- ------------", "10.249.128.200   scale-proto1-rqhtc64k   none        none", "10.249.128.201   scale-proto2-rqhtc64k   none        none", "", "$ sudo /usr/lpp/mmfs/bin/mmces service list -a", "Enabled services: NFS SMB S3", "scale-proto2-rqhtc64k:  NFS is running, SMB is running, S3 is running", "scale-proto1-rqhtc64k:  NFS is running, SMB is running, S3 is running", "", "(run on scale-proto1 over SSH from the installer node)"], "narration": "The last real check is outside the toolkit. The mmces command shows both export addresses assigned, one to each protocol node, and all three services running on both. An export address left unassigned is the failure the runbook warns about, and it did not happen here.", "source": {"capture": "2026-10-05-run", "phases": ["ces-verify"]}, "duration": 22.44, "start": 322.43}, {"title": "14. The SMB TIPS status", "lines": ["$ sudo /usr/lpp/mmfs/bin/mmhealth node show SMB -v", "SMB           TIPS          2026-10-05 22:16:36      smb_sensors_not_configured(SMBGlobalStats, SMBStats)", "smb_sensors_not_configured  SMB        TIP         2026-10-05 22:16:36  The SMB perfmon sensor SMBGlobalStats is not configured.", "ctdb_state_up               SMB        INFO        2026-10-05 22:16:36  The CTDB state is healthy.", "smbd_up                     SMB        INFO        2026-10-05 22:16:36  SMBD process is now running.", "", "TIPS here only means perfmon sensors are not configured."], "narration": "Health shows a TIPS status for SMB. The events say the SMB performance sensors are not configured, which affects performance statistics only. The service events below are healthy: the CTDB state is healthy and the SMB daemon is running. The runbook records this as expected and leaves the sensors alone.", "source": {"capture": "2026-10-05-run", "phases": ["mmhealth-smb"]}, "duration": 24.22, "start": 344.87}, {"title": "What the run took", "lines": ["setup                2.8s", "nsd add (6)          9.4s", "cluster config       3.4s", "install --precheck   1m 24.8s", "install              26m 29.2s", "install --postcheck  12.7s", "deploy --precheck    3m 55.2s", "deploy               17m 28.2s", "deploy --postcheck   9.3s", "", "Backend operation windows. The toolkit itself reported", "26 minutes 27 seconds for the install."], "narration": "Altogether the operations listed took about fifty minutes, almost all of it the install and the deploy. Defining nodes and storage took seconds. The waiting between phases in the original session is not included in these timings.", "source": {"capture": "2026-10-05-run", "phases": ["setup", "nsd-add", "cluster-config", "precheck-install", "install", "postcheck-install", "precheck-deploy", "deploy", "postcheck-deploy"]}, "duration": 18.44, "start": 369.09}], "duration": 387.53};
let index=0,elapsed=0,playing=false,last=null;
const el=id=>document.getElementById(id);
data.scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;el('chapters').appendChild(o)});
function render(){const s=data.scenes[index];el('heading').textContent=s.title;el('body').textContent=s.lines.join('\n');el('narration').textContent=s.narration;el('source').textContent=`Source: ${s.source.file}, ${s.source.start}–${s.source.end} seconds. Edited summary; not verbatim command footage.`;el('chapters').value=index;el('prev').disabled=index===0;el('next').disabled=index===data.scenes.length-1;update();}
function update(){const s=data.scenes[index];el('progress').value=Math.min(1,elapsed/s.duration);el('position').textContent=`Chapter ${index+1} of ${data.scenes.length} · ${s.duration.toFixed(2)} seconds · Total ${data.duration.toFixed(2)} seconds`;el('play').textContent=playing?'Pause':'Play';}
function go(i){index=Math.max(0,Math.min(data.scenes.length-1,i));elapsed=0;last=null;render()}
function toggle(){if(!playing&&index===data.scenes.length-1&&elapsed>=data.scenes[index].duration)go(0);playing=!playing;last=null;update()}
el('prev').onclick=()=>go(index-1);el('next').onclick=()=>go(index+1);el('restart').onclick=()=>{playing=false;go(0)};el('play').onclick=toggle;el('chapters').onchange=e=>go(Number(e.target.value));
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key===' '){e.preventDefault();toggle()}if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key==='Home'){playing=false;go(0)}});
function tick(t){if(last!==null&&playing){elapsed+=(t-last)/1000*Number(el('speed').value);if(elapsed>=data.scenes[index].duration){if(index<data.scenes.length-1){go(index+1)}else{elapsed=data.scenes[index].duration;playing=false}}update()}last=t;requestAnimationFrame(tick)}
render();requestAnimationFrame(tick);
</script></body></html>
