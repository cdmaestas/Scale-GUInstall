name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: every job here only reads the repo.
permissions:
  contents: read

jobs:
  # ── Python syntax + import check ──────────────────────────────────────────
  python-check:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Compile scale-server.py
        run: python3 -m py_compile scale-server.py

      - name: Import check (Flask required)
        run: |
          pip install --quiet "flask>=3.0,<4"
          python3 - <<'EOF'
          import ast, sys
          with open("scale-server.py") as f:
              tree = ast.parse(f.read())
          # Verify key routes are present
          routes = [
              node.args[0].value
              for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == "route"
              and node.args
              and isinstance(node.args[0], ast.Constant)
          ]
          required = ["/api/ping", "/api/stream/phase", "/api/stream/check-ansible"]
          missing = [r for r in required if r not in routes]
          if missing:
              print(f"FAIL: missing routes: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(routes)} routes found")
          EOF

  # ── Python unit tests ──────────────────────────────────────────────────────
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: pip install --quiet "flask>=3.0,<4" "waitress>=3.0,<4" pytest

      - name: Run tests
        run: python3 -m pytest tests/ -v

  # ── MCP server unit tests ──────────────────────────────────────────────────
  # Separate job from `pytest` above: the MCP server is a standalone package
  # with its own deps (mcp, httpx) that don't ship with the backend, and a
  # failure here shouldn't gate (or be gated by) the backend's own test job.
  mcp-server-pytest:
    name: mcp-server pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install mcp-server (editable, with dev deps)
        run: pip install --quiet -e "./mcp-server[dev]"

      - name: Run tests
        run: python3 -m pytest mcp-server/tests/ -v

  # ── Dependency vulnerability scan ──────────────────────────────────────────
  # Covers both dependency sets (backend: flask/waitress; mcp-server: mcp/
  # httpx) with one pip-audit pass over their union, rather than duplicating
  # the install+scan across two jobs.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      # Isolated in its own venv, not the runner's global site-packages —
      # pip-audit scans everything importable in its environment, and the
      # runner ships pre-installed tooling (requests, urllib3, setuptools,
      # twisted, wheel, …) with its own, unrelated advisories. Auditing the
      # global environment picked those up as false "our dependency" hits.
      - name: Install dependencies + pip-audit into an isolated venv
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --upgrade pip
          .audit-venv/bin/pip install --quiet "flask>=3.0,<4" "waitress>=3.0,<4" -e "./mcp-server" pip-audit

      - name: Audit installed packages
        run: .audit-venv/bin/pip-audit

  # ── Python lint ────────────────────────────────────────────────────────────
  # Small rule set (pyflakes, import order, bugbear, a few correctness rules) —
  # see ruff.toml. Formatting is not enforced.
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install ruff
        run: pip install --quiet "ruff==0.16.10"

      - name: Lint
        run: ruff check .

  # ── Static security analysis ───────────────────────────────────────────────
  # Medium and high severity only (-ll). The low-severity subprocess notes
  # (B603/B607/B404) are expected: every call passes an argument list, never
  # a shell string, and the pre-commit/CI security guard forbids shell=True.
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install bandit
        run: pip install --quiet "bandit==1.9.4"

      - name: Scan (medium and high severity)
        run: bandit -r scale-server.py mcp-server/src -ll

      # try/except/pass (B110) and try/except/continue (B112) swallow failures
      # silently; any occurrence is a regression, whatever its severity.
      - name: Scan (swallowed exceptions)
        run: bandit -r scale-server.py mcp-server/src -t B110,B112

  # ── Shell script linting ──────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning \
            start.sh \
            packaging/build-pkg.sh \
            packaging/scale-guinstall-wrapper \
            packaging/scale-guinstall-mmfs.sh \
            packaging/enable-ssh-forwarding.sh \
            packaging/debian/postinst \
            packaging/debian/prerm \
            packaging/debian/postrm \
            .githooks/pre-commit \
            .githooks/pre-push

  # ── Security regression guard ─────────────────────────────────────────────
  security-guard:
    name: Security guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Forbidden patterns
        run: |
          fail=0
          check() {
            # $1 = grep pattern, $2 = file, $3 = human description
            if grep -nE "$1" "$2" >/tmp/hits; then
              echo "FAIL: $3 in $2:"; cat /tmp/hits; fail=1
            fi
          }
          for f in scale-server.py mcp-server/src/scale_guinstall_mcp/*.py; do
            check 'shell\s*=\s*True' "$f" "shell=True (command injection risk)"
            check '\bpickle\.(load|loads)\(' "$f" "unsafe pickle deserialization"
            check '\byaml\.load\(' "$f" "unsafe yaml.load without SafeLoader"
            check '\beval\(' "$f" "eval() of untrusted input"
            # scale-server.py: any `except:` / `except Exception:` without a binding. The MCP
            # package has reviewed handlers that log via logger.exception, so only a truly
            # bare `except:` is forbidden there (the bandit job's B110/B112 pass catches
            # swallowed exceptions).
            if [ "$f" = scale-server.py ]; then
              check 'except\s*(Exception)?\s*:\s*$' "$f" "bare except with no body — silent-failure regression"
            else
              check 'except\s*:\s*$' "$f" "bare except — silent-failure regression"
            fi
          done
          exit "$fail"

      - name: innerHTML assignments must route through h()
        run: |
          # Flag single-line `.innerHTML = ...` template literals that
          # interpolate a value without ever calling h() on that line — a
          # regression on the app's one XSS defense. This is a fast
          # heuristic, not a full parser: multi-line literals and cases
          # where h() is called elsewhere in the expression aren't caught.
          #
          # Known-safe exceptions, reviewed and excluded below:
          #   data-backup="${idx}"   — idx is a numeric loop index, never user input
          #   ${removeBtn}           — a locally-built constant markup string, no user data inside it
          candidates=$(grep -nE '\.innerHTML\s*=.*\$\{' Scale-GUInstall.html || true)
          unescaped=$(echo "$candidates" \
            | grep -vF 'h(' \
            | grep -vF 'data-backup="${idx}"' \
            | grep -vF '${removeBtn}' \
            || true)
          if [ -n "$unescaped" ]; then
            echo "FAIL: innerHTML assignment(s) with a \${...} interpolation and no h() call on the same line:"
            echo "$unescaped"
            exit 1
          fi
          echo "OK: no unescaped innerHTML interpolations found"

  # ── JavaScript syntax check ───────────────────────────────────────────────
  js-check:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract and parse embedded JavaScript
        run: |
          python3 - <<'EOF'
          import re
          html = open("Scale-GUInstall.html").read()
          m = re.search(r"<script>(.*?)</script>", html, re.DOTALL)
          assert m, "no <script> block found"
          open("app.js", "w").write(m.group(1))
          EOF
          node --check app.js

  # ── HTML sanity check ─────────────────────────────────────────────────────
  html-check:
    name: HTML sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check HTML markers
        run: |
          python3 - <<'EOF'
          import sys
          with open("Scale-GUInstall.html") as f:
              html = f.read()
          checks = {
              "h() escape helper": "function h(str)",
              "streamToTerminalPost": "async function streamToTerminalPost",
              "127.0.0.1 backend default": "127.0.0.1:5001",
              "dry run toggle": "dry-run-toggle",
              "header dry run toggle": "header-dry-run-toggle",
              "install page": 'id="page-install"',
              "settings page": 'id="page-settings"',
              "help link": 'href="help.html"',
          }
          failed = [name for name, marker in checks.items() if marker not in html]
          if failed:
              print(f"FAIL: missing markers: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: all {len(checks)} markers present")
          size_kb = len(html.encode()) // 1024
          print(f"OK: file size {size_kb} KB")
          EOF

      - name: Check help.html markers
        run: |
          python3 - <<'EOF'
          import sys
          with open("help.html") as f:
              html = f.read()
          checks = {
              "title": "<title>Help",
              "back to app link": 'href="Scale-GUInstall.html"',
              "dry run section": 'id="dry-run"',
              "troubleshooting section": 'id="troubleshooting"',
              "remote access section": 'id="remote-access"',
          }
          failed = [name for name, marker in checks.items() if marker not in html]
          if failed:
              print(f"FAIL: missing markers: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: all {len(checks)} markers present")
          EOF

  # ── Build DEB ─────────────────────────────────────────────────────────────
  build-deb:
    name: Build DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Build DEB package
        run: ./packaging/build-pkg.sh --deb

      - name: Verify DEB
        run: |
          deb=$(ls dist/*.deb | head -1)
          echo "Package: $deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scale-guinstall-deb
          path: dist/*.deb

  # ── Build RPM ─────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install rpm-build
        run: sudo apt-get install -y rpm

      - name: Build RPM package
        run: ./packaging/build-pkg.sh --rpm

      - name: Verify RPM
        run: |
          rpm=$(ls dist/*.rpm | head -1)
          echo "Package: $rpm"
          rpm -qip "$rpm"
          rpm -qlp "$rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scale-guinstall-rpm
          path: dist/*.rpm
