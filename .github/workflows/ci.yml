name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Python syntax + import check ──────────────────────────────────────────
  python-check:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Compile scale-server.py
        run: python3 -m py_compile scale-server.py

      - name: Import check (Flask required)
        run: |
          pip install --quiet "flask>=3.0,<4"
          python3 - <<'EOF'
          import ast, sys
          with open("scale-server.py") as f:
              tree = ast.parse(f.read())
          # Verify key routes are present
          routes = [
              node.args[0].value
              for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == "route"
              and node.args
              and isinstance(node.args[0], ast.Constant)
          ]
          required = ["/api/ping", "/api/stream/phase", "/api/stream/check-ansible"]
          missing = [r for r in required if r not in routes]
          if missing:
              print(f"FAIL: missing routes: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(routes)} routes found")
          EOF

  # ── Shell script linting ──────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck --severity=warning \
            start.sh \
            packaging/build-pkg.sh \
            packaging/scale-guinstall-wrapper \
            packaging/scale-guinstall-mmfs.sh \
            packaging/enable-ssh-forwarding.sh \
            .githooks/pre-commit \
            .githooks/pre-push

  # ── Security regression guard ─────────────────────────────────────────────
  security-guard:
    name: Security guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Forbidden patterns
        run: |
          fail=0
          check() {
            # $1 = grep pattern, $2 = file, $3 = human description
            if grep -nE "$1" "$2" >/tmp/hits; then
              echo "FAIL: $3 in $2:"; cat /tmp/hits; fail=1
            fi
          }
          check 'shell\s*=\s*True' scale-server.py "shell=True (command injection risk)"
          check '\bpickle\.(load|loads)\(' scale-server.py "unsafe pickle deserialization"
          check '\byaml\.load\(' scale-server.py "unsafe yaml.load without SafeLoader"
          check '\beval\(' scale-server.py "eval() of untrusted input"
          check 'except\s*(Exception)?\s*:\s*$' scale-server.py "bare except with no body — silent-failure regression"
          exit "$fail"

      - name: innerHTML assignments must route through h()
        run: |
          # Flag single-line `.innerHTML = ...` template literals that
          # interpolate a value without ever calling h() on that line — a
          # regression on the app's one XSS defense. This is a fast
          # heuristic, not a full parser: multi-line literals and cases
          # where h() is called elsewhere in the expression aren't caught.
          #
          # Known-safe exceptions, reviewed and excluded below:
          #   data-backup="${idx}"   — idx is a numeric loop index, never user input
          #   ${removeBtn}           — a locally-built constant markup string, no user data inside it
          candidates=$(grep -nE '\.innerHTML\s*=.*\$\{' Scale-GUInstall.html || true)
          unescaped=$(echo "$candidates" \
            | grep -vF 'h(' \
            | grep -vF 'data-backup="${idx}"' \
            | grep -vF '${removeBtn}' \
            || true)
          if [ -n "$unescaped" ]; then
            echo "FAIL: innerHTML assignment(s) with a \${...} interpolation and no h() call on the same line:"
            echo "$unescaped"
            exit 1
          fi
          echo "OK: no unescaped innerHTML interpolations found"

  # ── JavaScript syntax check ───────────────────────────────────────────────
  js-check:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract and parse embedded JavaScript
        run: |
          python3 - <<'EOF'
          import re
          html = open("Scale-GUInstall.html").read()
          m = re.search(r"<script>(.*?)</script>", html, re.DOTALL)
          assert m, "no <script> block found"
          open("app.js", "w").write(m.group(1))
          EOF
          node --check app.js

  # ── HTML sanity check ─────────────────────────────────────────────────────
  html-check:
    name: HTML sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check HTML markers
        run: |
          python3 - <<'EOF'
          import sys
          with open("Scale-GUInstall.html") as f:
              html = f.read()
          checks = {
              "h() escape helper": "function h(str)",
              "streamToTerminalPost": "async function streamToTerminalPost",
              "127.0.0.1 backend default": "127.0.0.1:5001",
              "dry run toggle": "dry-run-toggle",
              "header dry run toggle": "header-dry-run-toggle",
              "install page": 'id="page-install"',
              "settings page": 'id="page-settings"',
              "help link": 'href="help.html"',
          }
          failed = [name for name, marker in checks.items() if marker not in html]
          if failed:
              print(f"FAIL: missing markers: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: all {len(checks)} markers present")
          size_kb = len(html.encode()) // 1024
          print(f"OK: file size {size_kb} KB")
          EOF

      - name: Check help.html markers
        run: |
          python3 - <<'EOF'
          import sys
          with open("help.html") as f:
              html = f.read()
          checks = {
              "title": "<title>Help",
              "back to app link": 'href="Scale-GUInstall.html"',
              "dry run section": 'id="dry-run"',
              "troubleshooting section": 'id="troubleshooting"',
              "remote access section": 'id="remote-access"',
          }
          failed = [name for name, marker in checks.items() if marker not in html]
          if failed:
              print(f"FAIL: missing markers: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: all {len(checks)} markers present")
          EOF

  # ── Build DEB ─────────────────────────────────────────────────────────────
  build-deb:
    name: Build DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Build DEB package
        run: ./packaging/build-pkg.sh --deb

      - name: Verify DEB
        run: |
          deb=$(ls dist/*.deb | head -1)
          echo "Package: $deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scale-guinstall-deb
          path: dist/*.deb

  # ── Build RPM ─────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install rpm-build
        run: sudo apt-get install -y rpm

      - name: Build RPM package
        run: ./packaging/build-pkg.sh --rpm

      - name: Verify RPM
        run: |
          rpm=$(ls dist/*.rpm | head -1)
          echo "Package: $rpm"
          rpm -qip "$rpm"
          rpm -qlp "$rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scale-guinstall-rpm
          path: dist/*.rpm
